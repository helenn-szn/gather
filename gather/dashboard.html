<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gather · Uncle Gus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;550;600;700&family=Lexend:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F6F7;--white:#fff;--line:#E9E9EC;--line2:#F0F0F2;--ink:#17171A;--ink2:#3F3F46;--muted:#83838C;--soft:#F4F4F5;
  --acc:#E8630F;--acc-t:#FDEFE5;--acc-d:#B84A08;--pumpkin:#E8630F;--brand:#E8630F;--olive:#5F6F52;--ol-t:#F4F4F5;--russet:#B4452A;
  --tp:#5F6F52;--ta:#C4661F;--font:'Geist',Inter,system-ui,sans-serif;--shadow:0 1px 2px rgba(16,16,20,.04),0 1px 1px rgba(16,16,20,.02)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button{font-family:inherit}
a{color:var(--acc-d)}
.app{display:flex;min-height:100vh}
aside{flex:0 0 232px;background:var(--bg);padding:22px 14px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:9px;padding:0 10px 22px}
.logo span{font-family:Lexend,sans-serif;font-weight:600;font-size:19px;letter-spacing:-.02em}
.sec{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:18px 10px 6px}
.nav{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink2);font-size:14px;font-weight:450}
.nav svg{color:var(--muted)}
.nav:hover{background:#EEEEF0}
.nav.on{background:var(--white);color:var(--ink);font-weight:550;box-shadow:var(--shadow),0 0 0 1px var(--line)}
.nav.on svg{color:var(--pumpkin)}
.nav .badge{margin-left:auto;background:var(--brand);color:#fff;font-size:10.5px;font-weight:600;border-radius:99px;padding:1px 7px}
.guscard{margin-top:auto;border-top:1px solid var(--line);padding:16px 10px 2px;display:flex;flex-direction:column;gap:6px}
.guscard .who{display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px}
.guscard p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--white);margin:10px 10px 10px 0;border-radius:16px;box-shadow:0 0 0 1px var(--line)}
header.top{height:64px;border-bottom:1px solid var(--line2);padding:0 36px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);border-radius:16px 16px 0 0}
header.top h1{margin:0;font-size:13.5px;font-weight:500;color:var(--muted)}header.top h1 b{color:var(--ink);font-weight:550}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.evpick{font:500 13px var(--font);background:var(--white);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink);max-width:240px}
.me{display:flex;align-items:center;gap:9px;padding-left:6px;border-left:1px solid var(--line);margin-left:4px}
.me .av{width:30px;height:30px;border-radius:50%;background:#E4E4E7;color:var(--ink);display:grid;place-items:center;font-weight:600;font-size:12.5px;margin-left:8px}

.status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:#22A06B;box-shadow:0 0 0 3px #E3F4EC}
.dot.off{background:#D92D20;box-shadow:0 0 0 3px #FDE7E4}
.content{padding:32px 36px 64px;display:flex;flex-direction:column;gap:24px;max-width:1180px;width:100%}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:22px 24px}
h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.row{display:flex;flex-wrap:wrap;gap:14px}
.btn{font:600 13.5px var(--font);color:#fff;background:var(--pumpkin);border:0;border-radius:9px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none;box-shadow:0 1px 2px rgba(232,99,15,.25),inset 0 1px 0 rgba(255,255,255,.15)}
.btn:hover{background:#D4550A}
.btn:disabled{opacity:.45;cursor:default}
.btn2{font:550 13.5px var(--font);color:var(--ink);background:var(--white);border:1px solid var(--line);border-radius:9px;padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none;box-shadow:var(--shadow)}
.btn2:hover{background:var(--soft)}
.ib{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--white);color:var(--ink2);display:grid;place-items:center;cursor:pointer;text-decoration:none}
.ib:hover{background:var(--soft)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 8px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--soft);color:var(--ink2);border:1px solid var(--line)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:#A1A1AA}
.chip svg{display:none}
.c-attending::before,.c-live::before{background:#22A06B}.c-invited::before{background:#E8A33D}.c-maybe::before{background:#D97706}
.c-declined::before,.c-done::before,.c-new::before{background:#A1A1AA}.c-draft::before{background:var(--brand)}

.hero .gusring svg{display:block;border-radius:50%;background:#fff}
.hero h2{font-size:30px;font-weight:600;letter-spacing:-.03em}
.hero .meta{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.hero .meta i{width:8px;height:8px;border-radius:50%;background:var(--tp)}
.hero .say{margin:6px 0 0;font-size:14.5px;color:var(--ink2)}
.stat{flex:1 1 190px;padding:18px 20px;display:flex;flex-direction:column;gap:2px}
.stat .ico{display:none}
.stat .l{font-size:12.5px;font-weight:500;color:var(--muted);order:-1;margin-bottom:10px}
.stat .n{font-size:30px;font-weight:600;line-height:1;letter-spacing:-.03em}
.stat .s{font-size:12.5px;color:var(--muted);margin-top:8px}
.need{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line2)}
.need .t{flex:1;font-size:14px;line-height:1.45}
.need .k{font-size:11px;font-weight:550;padding:3px 8px;border-radius:6px;background:var(--soft);color:var(--ink2);white-space:nowrap;text-transform:capitalize}
.need .k.blocked,.need .k.suspicious{background:#FDEEEA;color:var(--russet)}
.datebox{width:44px;height:46px;border-radius:9px;border:1px solid var(--line);background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:0 0 auto;box-shadow:var(--shadow)}
.datebox small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}.datebox b{font-size:17px;font-weight:600;color:var(--ink)}
.up{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line2)}
.up b{font-weight:550;font-size:14px}.up .s{font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);font-size:13.5px;padding:6px 0}
.evrow{padding:14px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;border:0;border-top:1px solid var(--line2);border-radius:0;box-shadow:none}
.evlist{overflow:hidden}.evlist .evrow:first-child{border-top:0}
.evrow:hover{background:#FBFBFC}
.evrow .nm{flex:1 1 220px;min-width:0}.evrow .nm b{font-size:14.5px;font-weight:550}.evrow .nm div{font-size:12.5px;color:var(--muted);margin-top:3px}
.col{flex:0 0 110px}.col.theme{flex-basis:150px}.col.st{flex-basis:120px}.col.act{flex-basis:76px}.col .h{font-size:11.5px;color:var(--muted);margin-bottom:5px}
.thumb{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;overflow:hidden;flex:0 0 auto}
.ring{width:16px;height:16px;border-radius:50%;display:inline-block;vertical-align:-3px;margin-right:7px}
.filters{display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:9px;border:1px solid var(--line)}
.filters button{font:500 12.5px var(--font);border:0;border-radius:7px;padding:5px 11px;background:transparent;color:var(--muted);cursor:pointer}
.filters button.on{background:var(--white);color:var(--ink);box-shadow:var(--shadow),0 0 0 1px var(--line)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;font-weight:500;color:var(--muted);padding:12px 16px;background:#FBFBFC;border-bottom:1px solid var(--line)}
td{padding:13px 16px;border-top:1px solid var(--line2);vertical-align:top;font-size:13.5px}
tr:first-child td{border-top:0}
td b{font-weight:550}
td small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.tg{font-size:12px;color:var(--ink2);cursor:pointer;background:none;border:0;padding:0;text-decoration:underline;text-decoration-color:#D4D4D8;text-underline-offset:3px}
.foodcat{flex:1 1 220px;padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.foodcat b{font-weight:550}
.bar{height:4px;border-radius:99px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--olive);border-radius:99px}
.bar i.full{background:var(--brand)}
.item{font-size:13.5px;display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line2)}
.item span{color:var(--muted)}
.feed{max-height:560px;overflow:auto}
.fi{display:flex;gap:14px;padding:10px 0;border-top:1px solid var(--line2);font-size:13.5px;color:var(--ink2)}
.fi .w{flex:0 0 64px;color:var(--muted);font-size:12px}

input.i,textarea.i,select.i{font:400 14px var(--font);color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;width:100%;box-shadow:var(--shadow)}
input.i:focus,textarea.i:focus{outline:none;border-color:var(--pumpkin);box-shadow:0 0 0 3px #FDE3D1}
textarea.i{min-height:88px;resize:vertical}
.types{display:flex;flex-wrap:wrap;gap:10px}
.type{position:relative;flex:1 1 140px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 10px 12px;cursor:pointer;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:8px}
.type .pic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;overflow:hidden}
.type b{font-size:13px;font-weight:550}
.type:hover{background:#FBFBFC}
.type.on{border-color:var(--pumpkin);box-shadow:0 0 0 1px var(--pumpkin),0 6px 16px rgba(232,99,15,.12)}
.type .tick{position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:50%;background:var(--pumpkin);color:#fff;display:none;place-items:center}
.type .tick svg{width:11px;height:11px}
.type.on .tick{display:grid}
.steps{display:flex;gap:10px;align-items:center}
.step{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.step i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:600;font-size:11.5px;border:1px solid var(--line);background:#fff}
.step.on{color:var(--ink);font-weight:550}.step.on i{background:var(--pumpkin);color:#fff;border-color:var(--pumpkin)}.step.done i{background:var(--soft);color:var(--ink)}
.steps .ln{width:28px;height:1px;background:var(--line)}
.grow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line2)}
.grow:first-child{border-top:0}
.grow .av{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--ink2);display:grid;place-items:center;font-weight:600;font-size:12px;flex:0 0 auto;border:1px solid var(--line)}
.grow .nm{flex:1 1 140px;font-weight:550}.grow .ct{flex:2 1 200px;font-size:13px;color:var(--muted)}
.err{color:var(--russet);font-size:13px;min-height:18px}
.note{background:#FBFBFC;border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:flex;gap:14px;align-items:center;font-size:13.5px;color:var(--ink2)}
.banner{background:#FFFBF3;border:1px solid #F3E4C4;border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;font-size:13.5px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pagehead h2{font-size:24px;font-weight:600;letter-spacing:-.025em}
.pagehead p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
@media (max-width:900px){.app{flex-direction:column}aside{position:static;height:auto;flex:none;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px}
  .logo{padding:4px 8px}.sec,.guscard{display:none}.nav .lbl{display:none}.main{margin:0;border-radius:0}
  header.top{position:static;height:auto;padding:12px 16px;flex-wrap:wrap}.content{padding:18px}.me div{display:none}}
</style>
</head>
